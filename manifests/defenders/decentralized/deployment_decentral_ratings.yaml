# ── ddos-defender-ratings: Decentralized pod for 'ratings' service (port 30084) ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ddos-defender-ratings
  namespace: default
  labels:
    app: ddos-defender-ratings
    mode: decentralized
    service: ratings
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ddos-defender-ratings
  template:
    metadata:
      labels:
        app: ddos-defender-ratings
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: ddos-defender-sa
      priorityClassName: ddos-defender-critical
      terminationGracePeriodSeconds: 5
      containers:
        - name: defender
          image: boktiar/ddos-defender:v10
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DETECTION_MODE
              value: "decentralized"
            - name: SERVICE_NAME
              value: "ratings"
            - name: MODELS_DIR
              value: "/app/models"
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2048Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ddos-defender-ratings
  namespace: default
spec:
  selector:
    app: ddos-defender-ratings
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30084
      name: http
