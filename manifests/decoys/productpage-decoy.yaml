apiVersion: apps/v1
kind: Deployment
metadata:
  name: productpage-decoy
  namespace: default
  labels:
    app: productpage-decoy
    version: v4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productpage-decoy
  template:
    metadata:
      labels:
        app: productpage-decoy
        version: v4
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: decoy
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -u
            - -c
            - |
              from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
              import sys
              import json

              class DecoySinkholeHandler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json; charset=utf-8')
                      self.send_header('X-Quarantine-Destination', 'v4-sinkhole')
                      self.send_header('X-Decoy-Service', 'productpage-decoy')
                      self.send_header('X-Mitigation-Action', 'isolated-quarantine')
                      self.end_headers()
                      payload = {
                          "status": "quarantined",
                          "destination": "v4-sinkhole",
                          "service": "productpage-decoy",
                          "workload_version": "v4",
                          "isolation": "enforced_default_deny_egress",
                          "message": "Traffic redirected to isolated research sinkhole; downstream Bookinfo calls blocked."
                      }
                      self.wfile.write(json.dumps(payload, indent=2).encode('utf-8') + b"\n")

                  def do_POST(self):
                      self.do_GET()

                  def do_HEAD(self):
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json; charset=utf-8')
                      self.send_header('X-Quarantine-Destination', 'v4-sinkhole')
                      self.send_header('X-Decoy-Service', 'productpage-decoy')
                      self.send_header('X-Mitigation-Action', 'isolated-quarantine')
                      self.end_headers()

                  def log_message(self, format, *args):
                      sys.stdout.write(f"[DECOY-v4] {self.address_string()} - {format % args}\n")
                      sys.stdout.flush()

              server = ThreadingHTTPServer(('0.0.0.0', 8080), DecoySinkholeHandler)
              print("[DECOY-v4] Dedicated concurrent sinkhole responder listening on port 8080...", flush=True)
              server.serve_forever()
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: productpage-decoy
  namespace: default
  labels:
    app: productpage-decoy
    service: productpage-decoy
spec:
  selector:
    app: productpage-decoy
  ports:
    - name: http
      port: 9080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: productpage-decoy-isolation
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: productpage-decoy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming HTTP traffic to container port 8080 and Envoy proxy interceptors
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 15001
        - protocol: TCP
          port: 15006
  egress:
    # Default-deny egress: strictly enforces network isolation.
    # Completely blocks connections to Bookinfo downstream services (details:9080, reviews:9080, ratings:9080)
    # and prevents outbound attack propagation. Permitted egress is restricted to core infrastructure:
    # 1. Cluster DNS resolution (CoreDNS / kube-dns) in kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Istiod control plane (for Envoy xDS/mTLS synchronization in istio-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012
---
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: productpage-decoy-sidecar
  namespace: default
spec:
  workloadSelector:
    labels:
      app: productpage-decoy
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY
  egress:
    # Restrict Envoy proxy egress discovery: only configure listeners for control plane and DNS
    - hosts:
        - "istio-system/*"
        - "kube-system/*"
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: productpage-decoy-dr
  namespace: default
spec:
  host: productpage-decoy
  subsets:
    - name: v4
      labels:
        version: v4
