apiVersion: apps/v1
kind: Deployment
metadata:
  name: details-decoy
  namespace: default
  labels:
    app: details-decoy
    version: v4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: details-decoy
  template:
    metadata:
      labels:
        app: details-decoy
        version: v4
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: decoy
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -u
            - -c
            - |
              from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
              import sys
              import json
              import re

              class DetailsDecoySinkholeHandler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      # Health probe endpoint
                      if self.path in ('/health', '/healthz', '/'):
                          self.send_response(200)
                          self.send_header('Content-Type', 'application/json; charset=utf-8')
                          self.send_header('X-Quarantine-Destination', 'v4-sinkhole')
                          self.send_header('X-Decoy-Service', 'details-decoy')
                          self.end_headers()
                          payload = {
                              "status": "Details decoy is healthy",
                              "service": "details-decoy",
                              "version": "v4"
                          }
                          self.wfile.write(json.dumps(payload).encode('utf-8') + b"\n")
                          return

                      # Parse numeric ID from /details/{id}
                      match = re.search(r'/details/(\d+)', self.path)
                      book_id = int(match.group(1)) if match else 0

                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json; charset=utf-8')
                      self.send_header('X-Quarantine-Destination', 'v4-sinkhole')
                      self.send_header('X-Decoy-Service', 'details-decoy')
                      self.send_header('X-Mitigation-Action', 'isolated-quarantine')
                      self.end_headers()

                      # Harmless, structurally valid Bookinfo details schema with decoy headers
                      payload = {
                          "id": book_id,
                          "author": "William Shakespeare",
                          "year": 1595,
                          "type": "paperback",
                          "pages": 200,
                          "publisher": "PublisherA",
                          "language": "English",
                          "ISBN-10": "1234567890",
                          "ISBN-13": "123-1234567890",
                          "quarantine_status": "quarantined",
                          "destination": "v4-sinkhole",
                          "service": "details-decoy",
                          "workload_version": "v4",
                          "isolation": "enforced_default_deny_egress",
                          "message": "Traffic redirected to isolated Details research sinkhole; backend access blocked."
                      }
                      self.wfile.write(json.dumps(payload, indent=2).encode('utf-8') + b"\n")

                  def do_POST(self):
                      self.do_GET()

                  def do_HEAD(self):
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json; charset=utf-8')
                      self.send_header('X-Quarantine-Destination', 'v4-sinkhole')
                      self.send_header('X-Decoy-Service', 'details-decoy')
                      self.send_header('X-Mitigation-Action', 'isolated-quarantine')
                      self.end_headers()

                  def log_message(self, format, *args):
                      sys.stdout.write(f"[DETAILS-DECOY-v4] {self.address_string()} - {format % args}\n")
                      sys.stdout.flush()

              server = ThreadingHTTPServer(('0.0.0.0', 8080), DetailsDecoySinkholeHandler)
              print("[DETAILS-DECOY-v4] Dedicated concurrent Details sinkhole responder listening on port 8080...", flush=True)
              server.serve_forever()
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: details-decoy
  namespace: default
  labels:
    app: details-decoy
    service: details-decoy
spec:
  selector:
    app: details-decoy
  ports:
    - name: http
      port: 9080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: details-decoy-isolation
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: details-decoy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming HTTP traffic to container port 8080 and Envoy proxy interceptors
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 15001
        - protocol: TCP
          port: 15006
  egress:
    # Default-deny egress: strictly enforces network isolation.
    # Completely blocks connections to all other cluster workloads and databases.
    # Permitted egress is restricted to core infrastructure:
    # 1. Cluster DNS resolution (CoreDNS / kube-dns) in kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Istiod control plane (for Envoy xDS/mTLS synchronization in istio-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012
---
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: details-decoy-sidecar
  namespace: default
spec:
  workloadSelector:
    labels:
      app: details-decoy
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY
  egress:
    # Restrict Envoy proxy egress discovery: only configure listeners for control plane and DNS
    - hosts:
        - "istio-system/*"
        - "kube-system/*"
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: details-decoy-dr
  namespace: default
spec:
  host: details-decoy
  subsets:
    - name: v4
      labels:
        version: v4
