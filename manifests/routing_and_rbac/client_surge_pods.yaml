apiVersion: v1
kind: Pod
metadata:
  name: client-surge-1
  namespace: default
  labels:
    app: client-surge-1
    run: client-surge-1
spec:
  restartPolicy: Always
  containers:
  - name: client-surge-1
    image: python:3.11-slim
    imagePullPolicy: IfNotPresent
    command: ["sleep", "infinity"]
