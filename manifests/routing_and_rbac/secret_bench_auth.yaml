apiVersion: v1
kind: Secret
metadata:
  name: ddos-bench-auth
  namespace: default
  labels:
    app.kubernetes.io/part-of: ddos-defender
type: Opaque
stringData:
  # The benchmark replay authentication token is stored securely in this Kubernetes Secret
  # and injected into controller pods via secretKeyRef, preventing exposure in public manifests.
  token: "<REDACTED_BENCH_AUTH_TOKEN>"
