apiVersion: v1
kind: ServiceAccount
metadata:
  name: ddos-defender-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ddos-defender-role
rules:
# Core resources
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# Istio networking
- apiGroups: ["networking.istio.io"]
  resources: ["virtualservices", "destinationrules"]
  verbs: ["get", "list", "create", "patch", "update"]
# Apps (for reading deployments)
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
# Coordination (for distributed lease locks)
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ddos-defender-binding
subjects:
- kind: ServiceAccount
  name: ddos-defender-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: ddos-defender-role
  apiGroup: rbac.authorization.k8s.io
